server {
    listen 80;
    server_name _;

    # Логи
    access_log /var/log/nginx/fefu_lab_access.log;
    error_log /var/log/nginx/fefu_lab_error.log;

    # Статические файлы
    location /static/ {
        alias /var/www/fefu_lab/Django1/web_2025/fefu_lab/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы
    location /media/ {
        alias /var/www/fefu_lab/Django1/web_2025/fefu_lab/media/;
    }

    # Приложение
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}